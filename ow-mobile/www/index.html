<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OW 궁극기·쿨타임</title>
<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0e13;--cd:#131a23;--tx:#e9eff6;--mu:#7f8c9b;--ln:#243040;--ac:#3cff6b;--wn:#ffe600;--bar:#17402b}}
:root[data-theme="dark"]{--bg:#0a0e13;--cd:#131a23;--tx:#e9eff6;--mu:#7f8c9b;--ln:#243040;--ac:#3cff6b;--wn:#ffe600;--bar:#17402b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:600 14px/1.2 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;display:flex;flex-direction:column;gap:6px;padding:6px 8px;overflow:hidden}

.sk span{position:relative}.sk .l{font-size:10px;color:var(--mu)}

</style></head><body>
<header><span class="t">OW 궁극기·쿨타임</span><span class="hint" id="ht">음성: 추가 디바 트레 겐지 · 1번 e · 3번 궁극기 이천오백 · 2번 교체 한조 · 초기화</span>
<button id="mb">상시</button><button id="vb">음성</button><button id="rs">초기화</button><button id="th">테마</button></header>
<main id="m"></main><div id="md"><div id="bx"></div></div><div id="ts"></div>
<script src="data.js"></script>
<script>
const RAW=`디바|T|1700|7|4||
레킹볼|T|1850|15||5|8
라인하르트|T|1960|6|7||
둠피스트|T|1975|7|6.5|4|

도미나|T|2200|7|7|14|

캐서디|D|1800|12|5||
에코|D|1850|8|6|6|
메이|D|1925|12|12||
벤쳐|D|1950||8|8|
겐지|D|2000|8|8||
안란|D|2000|8|8||
시메트라|D|2025|12|||
바스티온|D|2050||12|8|
리퍼|D|2050|10|8|6|
벤데타|D|2050|7|10||
정크렛|D|2100|10|7||
파라|D|2200|8|14|9|
소전|D|2300|15|7||
시에라|D|2350|7|11|10|
토르비욘|D|2350|10|12||

애쉬|D|2450|12|10||

솔저|D|2750|15||6|
솜브라|S|1850|7.5|13|8|

아나|S|2300|12|14||
라이프위버|S|2400|18|12||
젠야타|S|2500||||
바티스트|S|2550|20|12||
제트팩캣|S|2575|12|2||
브리기테|S|2700|5|4|5|
모이라|S|2700|8|6||
키리코|S|2725|14|7||
독트린|S|2800|14|10|9|
우양|S|2800|14|8||
주노|S|2900|14|6|10|
루시우|S|2900|12||5|
일리아리|S|2975|14|8||
미즈키|S|3100|12|12|6|`;
const H={},RN={T:'탱커',D:'딜러',S:'힐러'},RO=['T','D','D','S','S'],KL=['E','SHIFT','우클릭','컨트롤'];
RAW.trim().split('\n').forEach(l=>{const[a,r,u,e,s,m,c]=l.split('|');H[a]={r,u:+u,cd:[e,s,m,c].map(x=>x===''?null:+x)}});
const blank=()=>RO.map(()=>({h:null,last:0,t:[0,0,0]}));
let S={slots:blank(),ov:{}};
try{const x=JSON.parse(localStorage.getItem('ow')||'null');if(x&&x.slots)S=x}catch(e){}
const save=()=>{try{localStorage.setItem('ow',JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id),cdOf=(h,k)=>{const o=S.ov[h];return o&&o.cd&&o.cd[k]!=null?o.cd[k]:H[h].cd[k]},uOf=h=>(S.ov[h]&&S.ov[h].u)||H[h].u;
function toast(t){const e=$('ts');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',1800)}
function render(){const m=$('m');m.innerHTML='';S.slots.forEach((s,i)=>{const r=document.createElement('div');r.className='row';r.dataset.i=i;
 let h=`<div class="role">${i+1}<br>${RN[RO[i]]}</div>`;
 if(!s.h)h+=`<div class="empty" data-a="hero">＋ ${RN[RO[i]]} 추가</div>`;
 else{h+=`<div class="hero" data-a="hero"><b>${s.h}</b><small>사용 ${s.last}</small></div><div class="ult" data-a="ult"><div class="n">${s.last+uOf(s.h)}</div><small>다음 궁극기</small></div><div class="sks">`;
  for(let k=0;k<(cdOf(s.h,3)!=null?4:3);k++)h+=`<div class="sk" data-a="sk" data-k="${k}"><i></i><span class="l">${KL[k]}</span><span class="v"></span></div>`;h+='</div>'}
 r.innerHTML=h;m.appendChild(r)});tick();save()}
function tick(){const n=Date.now();document.querySelectorAll('.sk').forEach(e=>{const i=+e.parentNode.parentNode.dataset.i,k=+e.dataset.k,s=S.slots[i],c=cdOf(s.h,k),rem=((s.t[k]||0)-n)/1000,v=e.querySelector('.v'),b=e.querySelector('i');
 if(c==null||c<=0){e.className='sk off';v.textContent='-';b.style.width=0}
 else if(rem>0){e.className='sk run'+(rem<=2?' warn':'');v.textContent=Math.ceil(rem);b.style.width=Math.min(100,rem/c*100)+'%'}
 else{e.className='sk';v.textContent=c+'s';b.style.width=0}})}
setInterval(tick,100);
function start(i,k){const s=S.slots[i],c=s.h&&cdOf(s.h,k);if(!s.h)return toast((i+1)+'번 자리가 비었어요');if(c==null)return toast('쿨타임 데이터 없음 (길게 눌러 입력)');s.t[k]=Date.now()+c*1000;save();tick();navigator.vibrate&&navigator.vibrate(20)}
function modal(h){$('bx').innerHTML=h;$('md').style.display='flex'}const close=()=>$('md').style.display='none';
$('md').onclick=e=>{if(e.target.id==='md')close()};
function picker(i){const l=Object.keys(H).filter(a=>H[a].r===RO[i]);modal(`<div style="margin-bottom:8px">${i+1}번 ${RN[RO[i]]} 선택</div><div class="g">${l.map(a=>`<button data-h="${a}">${a}</button>`).join('')}</div><button data-h="" style="margin-top:8px;width:100%">비우기</button>`);
 $('bx').onclick=e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.h;if(a!==S.slots[i].h)S.slots[i]=a?{h:a,last:0,t:[0,0,0]}:{h:null,last:0,t:[0,0,0]};close();render()}}
function keypad(i){const s=S.slots[i];let v='';const draw=()=>{$('bx').querySelector('.big').textContent=(+v||0)+uOf(s.h);$('bx').querySelector('.in').textContent=v||'0'};
 modal(`<div>${s.h} 궁극기를 쓴 시점의 코스트</div><div class="in big" style="color:var(--tx)">0</div><div>→ 다음 궁극기</div><div class="big">${uOf(s.h)}</div><div class="g kp" style="margin-top:8px">${[1,2,3,4,5,6,7,8,9,'⌫',0,'확인'].map(x=>`<button data-x="${x}">${x}</button>`).join('')}</div>`);
 $('bx').onclick=e=>{const b=e.target.closest('button');if(!b)return;const x=b.dataset.x;if(x==='확인'){s.last=+v||0;close();render()}else{v=x==='⌫'?v.slice(0,-1):(v+x).slice(0,5);draw()}}}
function act(el,long){const i=+el.closest('.row').dataset.i,s=S.slots[i],a=el.dataset.a;
 if(a==='hero'){if(!long||!s.h)return picker(i);const u=prompt(s.h+' 궁극기 코스트',uOf(s.h));if(u&&+u>0){(S.ov[s.h]=S.ov[s.h]||{}).u=+u;render()}}
 else if(a==='ult'){if(long){s.last=0;render();toast('사용 기록 0으로')}else keypad(i)}
 else{const k=+el.dataset.k;if(!long)return start(i,k);if(s.t[k]>Date.now()){s.t[k]=0;save();return tick()}
  const c=prompt(s.h+' '+KL[k]+' 쿨타임(초)',cdOf(s.h,k)==null?'':cdOf(s.h,k));if(c&&+c>0){const o=S.ov[s.h]=S.ov[s.h]||{};(o.cd=o.cd||[null,null,null])[k]=+c;save();tick()}}}
let lp,lg=0;const M=$('m');
M.addEventListener('pointerdown',e=>{const el=e.target.closest('[data-a]');if(!el)return;lg=0;lp=setTimeout(()=>{lg=1;act(el,1)},550);M.onpointerup=ev=>{clearTimeout(lp);if(!lg)act(el,0);M.onpointerup=null}});
M.addEventListener('pointermove',()=>{});M.addEventListener('pointercancel',()=>{clearTimeout(lp);M.onpointerup=null});
$('rs').onclick=()=>{if(confirm('모든 정보를 초기화할까요?')){S.slots=blank();render()}};
const tm=()=>{const d=localStorage.getItem('th')||'dark';document.documentElement.dataset.theme=d};try{tm()}catch(e){document.documentElement.dataset.theme='dark'}
$('th').onclick=()=>{try{localStorage.setItem('th',document.documentElement.dataset.theme==='dark'?'light':'dark');tm()}catch(e){}};
const NC=/^[영공일이삼사오육칠팔구십백천만0-9]+$/,PT=['으로','이랑','한테','에게','이','가','은','는','을','를','야','아','도','의','에','로','랑','만','좀','요'];
const AM=ALIAS.am,KM=ALIAS.km,WM=ALIAS.wm,SM=ALIAS.sm,nz=s=>s.normalize('NFKC').toLowerCase().replace(/[^0-9a-z\u3131-\u318e\uac00-\ud7a3]/g,'');
const D={영:0,공:0,일:1,이:2,삼:3,사:4,오:5,육:6,칠:7,팔:8,구:9},U={십:10,백:100,천:1000};
function kn(s){if(/^\d+$/.test(s))return+s;let t=0,n=0,ok=0;for(const c of s){if(c in D){n=D[c];ok=1}else if(c in U){t+=(n||1)*U[c];n=0;ok=1}else if(/\d/.test(c)){n=n*10+ +c;ok=1}}return ok?t+n:null}
function dice(a,b){const g=s=>{const r={};for(let i=0;i<s.length-1;i++){const k=s.substr(i,2);r[k]=(r[k]||0)+1}return r},x=g(a),y=g(b);let n=0,t=0;for(const k in x){t+=x[k];if(y[k])n+=Math.min(x[k],y[k])}for(const k in y)t+=y[k];return t?2*n/t:0}
function cls(tok,key,num){const n=nz(tok);if(!n)return null;const c=[n];PT.forEach(p=>{if(n.length>p.length&&n.endsWith(p))c.push(n.slice(0,-p.length))});
 for(const x of c){if(WM[x])return['kw',WM[x]];if(AM[x])return['hero',AM[x]];if(key&&KM[x]!=null)return['key',KM[x]]}
 if(num&&NC.test(n))return['num',kn(n)];
 if(n.length>=3){let b=0,h=null;for(const a in AM)if(a.length>=3){const v=dice(n,a);if(v>b){b=v;h=AM[a]}}if(b>=.75)return['hero',h]}return null}
const isU=x=>WM[x]==='ult'||WM[x.replace(/[를을가]$/,'')]==='ult';
function pslot(T){const f=nz(T[0]),w=Object.keys(SM).sort((a,b)=>b.length-a.length).find(x=>f.startsWith(x));if(!w)return null;const i=SM[w];
 const R=(f.slice(w.length).replace(/^번째?/,'')?[f.slice(w.length).replace(/^번째?/,'')]:[]).concat(T.slice(1));while(R.length&&/^번째?$/.test(nz(R[0])))R.shift();if(!R.length)return null;const h=nz(R[0]);
 if(KM[h]!=null)return{k:'sk',i,key:KM[h]};
 if(isU(h)){const ns=R.slice(1).map(nz).filter(x=>x&&NC.test(x)),v=ns.length?kn(ns.join('')):null;return v!=null&&v>=0&&v<=1e5?{k:'ult',i,n:v}:null}
 if(WM[h]==='replace')for(const t of R.slice(1)){const c=cls(t,0,0);if(c&&c[0]==='hero')return{k:'rep',i,b:c[1]}}return null}
function parse(text){let T=text.replace(/,/g,'').trim().split(/\s+/).filter(Boolean);if(!T.length)return null;const sl=pslot(T);if(sl)return sl;
 const hu=T.some(t=>isU(nz(t)));if(hu){const M=[];T.forEach(t=>{const n=nz(t);if(n&&NC.test(n)&&M.length&&NC.test(nz(M[M.length-1])))M[M.length-1]+=t;else M.push(t)});T=M}
 const it=[];for(let i=0;i<T.length;){let hit=null,g=1;for(const n of[3,2])if(!hit&&i+n<=T.length){const j=nz(T.slice(i,i+n).join(''));if(AM[j]){hit=['hero',AM[j]];g=n}}
  if(!hit)hit=cls(T[i],!hu,hu);if(hit)it.push([hit[0],hit[1],i]);i+=g}
 const K=it.filter(x=>x[0]==='kw'),Hs=it.filter(x=>x[0]==='hero'),Ks=it.filter(x=>x[0]==='key').map(x=>x[1]),Ns=it.filter(x=>x[0]==='num').map(x=>x[1]),kd=K[0]&&K[0][1];
 if(K.some(x=>x[1]==='reset'))return{k:'reset'};
 if(kd==='add'&&Hs.length)return{k:'add',hs:[...new Set(Hs.map(x=>x[1]))]};
 if(kd==='replace'){const p=K[0][2],L=Hs.filter(x=>x[2]<p),R=Hs.filter(x=>x[2]>p);if(L.length&&R.length)return{k:'rep',a:L[L.length-1][1],b:R[0][1]};if(R.length>1)return{k:'rep',a:R[0][1],b:R[1][1]};return null}
 if(kd==='ult')return Hs.length&&Ns.length&&Ns[0]>=0&&Ns[0]<=1e5?{k:'ult',h:Hs[0][1],n:Ns[0]}:null;
 return!kd&&Hs.length&&Ks.length?{k:'sk',h:Hs[0][1],key:Ks[0]}:null}
function exec(c){const L=S.slots;
 if(c.k==='reset'){S.slots=blank();return render()}
 if(c.k==='add'){for(const h of c.hs){if(L.some(s=>s.h===h)||!H[h])continue;const i=L.findIndex((s,j)=>!s.h&&RO[j]===H[h].r);if(i>=0)L[i]={h,last:0,t:[0,0,0]}}return render()}
 const i=c.i!=null?c.i:L.findIndex(s=>s.h===(c.h||c.a));if(i<0)return toast('등록된 영웅이 아니에요');
 if(c.k==='rep'){if(!H[c.b]||L.some(s=>s.h===c.b))return toast('교체할 수 없어요');L[i]={h:c.b,last:0,t:[0,0,0]};return render()}
 if(!L[i].h)return toast((i+1)+'번 자리가 비었어요');
 if(c.k==='ult'){L[i].last=c.n;return render()}start(i,c.key)}
function handle(ms){$('ht').textContent=ms[0];for(const t of ms){const c=parse(t);if(c){exec(c);return}}toast('? '+ms[0])}
let von=0,md=0;const P=()=>window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.SpeechRecognition;
async function once(){const p=P();if(p){const r=await p.start({language:'ko-KR',maxResults:5,partialResults:false,popup:false});return r&&r.matches||[]}
 return new Promise(res=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){toast('음성 인식을 지원하지 않아요');von=0;return res([])}const rc=new R();rc.lang='ko-KR';rc.maxAlternatives=5;rc.onresult=e=>res([...e.results[0]].map(x=>x.transcript));rc.onerror=()=>res([]);rc.onend=()=>res([]);rc.start()})}
async function loop(){while(von){try{const m=await once();if(m.length)handle(m)}catch(e){await new Promise(r=>setTimeout(r,500))}}$('vb').classList.remove('on')}
async function perm(){const p=P();if(!p)return 1;const r=await p.requestPermissions();return r.speechRecognition==='granted'}
function setV(on){von=on;$('vb').classList.toggle('on',!!on);if(on)loop()}
$('vb').onclick=async()=>{if(!(await perm()))return toast('마이크 권한이 필요해요');if(md){const m=await once();m.length?handle(m):toast('못 알아들었어요')}else setV(!von)};
$('mb').onclick=()=>{md^=1;$('mb').textContent=md?'버튼':'상시';if(md)von=0};
window.addEventListener('load',async()=>{if(P()&&await perm())setV(1)});
try{navigator.wakeLock&&navigator.wakeLock.request('screen')}catch(e){}
document.addEventListener('visibilitychange',()=>{try{document.visibilityState==='visible'&&navigator.wakeLock&&navigator.wakeLock.request('screen')}catch(e){}});
render();
</script></body></html>
